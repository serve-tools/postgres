name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --global npm@11.18.0
      - run: npm ci --ignore-scripts --workspaces=false
      - run: npm run verify

  native:
    name: Native (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
          - platform: darwin-x64
            runner: macos-15-intel
          - platform: linux-arm64-gnu
            runner: ubuntu-24.04-arm
          - platform: linux-x64-gnu
            runner: ubuntu-24.04
          - platform: win32-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.18.0
      - run: npm ci --ignore-scripts --workspaces=false
      - run: npm run import -- --platform ${{ matrix.platform }}
      - run: npm run smoke

  musl:
    name: Native (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-arm64-musl
            runner: ubuntu-24.04-arm
          - platform: linux-x64-musl
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Import and smoke on musl
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            node:24-alpine \
            sh -c "npm install --global npm@11.18.0 && npm ci --ignore-scripts --workspaces=false && npm run import -- --platform ${{ matrix.platform }} && npm run smoke"
